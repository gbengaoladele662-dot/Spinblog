<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blogr - A modern publishing platform for growing audiences."
    />
    <title>Blogr | A Modern Publishing Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;600&family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --clr-red-light: hsl(356, 100%, 66%);
        --clr-red-dark: hsl(355, 100%, 74%);
        --clr-red-hover: hsl(356, 100%, 58%);
        --clr-hero-start: hsl(13, 100%, 72%);
        --clr-hero-end: hsl(353, 100%, 62%);
        --clr-heading: hsl(208, 49%, 24%);
        --clr-body: hsl(207, 13%, 34%);
        --clr-footer-bg: hsl(240, 10%, 16%);
        --clr-footer-text: hsl(240, 2%, 79%);
        --grad-hero: linear-gradient(135deg, var(--clr-hero-start), var(--clr-hero-end));
        --grad-infra: linear-gradient(135deg, hsl(237, 17%, 21%), hsl(237, 23%, 32%));
        --font-body: "Overpass", sans-serif;
        --font-ui: "Ubuntu", sans-serif;
        --radius-pill: 9999px;
        --radius-lg: 1rem;
        --radius-md: 0.5rem;
        --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.15);
        --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.22);
        --shadow-drop: 0 16px 40px rgba(0, 0, 0, 0.22);
        --transition: 250ms ease;
        --container: 1160px;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; font-size: 16px; }

      body {
        font-family: var(--font-body);
        font-weight: 300;
        color: var(--clr-body);
        line-height: 1.7;
        background: #fff;
        overflow-x: hidden;
      }

      img, svg { display: block; max-width: 100%; }
      ul { list-style: none; }
      a { text-decoration: none; color: inherit; }
      button { cursor: pointer; border: none; background: none; font-family: inherit; }

      /* SKIP LINK */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 1rem;
        padding: 0.75rem 1.25rem;
        background: var(--clr-heading);
        color: #fff;
        font-family: var(--font-ui);
        font-weight: 700;
        border-radius: var(--radius-md);
        z-index: 9999;
        transition: top 150ms ease;
      }
      .skip-link:focus { top: 1rem; }

      :focus-visible {
        outline: 3px solid var(--clr-red-light);
        outline-offset: 3px;
        border-radius: 3px;
      }

      /* CONTAINER */
      .container {
        max-width: var(--container);
        margin-inline: auto;
        padding-inline: clamp(1.25rem, 5vw, 2rem);
      }

      /* BUTTONS */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.75rem;
        border-radius: var(--radius-pill);
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 0.875rem;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        transition: background var(--transition), color var(--transition),
          transform 150ms ease, box-shadow var(--transition), border-color var(--transition);
        border: 2px solid transparent;
      }

      .btn:hover { transform: translateY(-2px); }
      .btn:active { transform: translateY(0); }

      .btn--ghost {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.6);
        background: transparent;
      }
      .btn--ghost:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: #fff;
      }

      .btn--ghost-dark {
        color: var(--clr-heading);
        background: transparent;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        border-color: transparent;
      }
      .btn--ghost-dark:hover { opacity: 0.65; }

      .btn--primary {
        background: #fff;
        color: var(--clr-red-light);
        border-color: transparent;
      }
      .btn--primary:hover {
        background: var(--clr-red-dark);
        color: #fff;
        box-shadow: var(--shadow-md);
      }

      .btn--outline {
        color: #fff;
        border-color: rgba(255, 255, 255, 0.85);
        background: transparent;
      }
      .btn--outline:hover {
        background: #fff;
        color: var(--clr-red-light);
        border-color: #fff;
      }

      .btn--lg { padding: 0.9rem 2rem; font-size: 1rem; }

      /* HEADER */
      .header {
        background: var(--grad-hero);
        border-radius: 0 0 0 100px;
        position: relative;
        overflow: hidden;
        padding-bottom: 5rem;
      }

      .header::before {
        content: "";
        position: absolute;
        top: -40%;
        right: -15%;
        width: 75%;
        height: 170%;
        background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.1) 0%, transparent 68%);
        border-radius: 50%;
        pointer-events: none;
      }

      /* NAV */
      .nav {
        display: flex;
        align-items: center;
        gap: 2rem;
        height: 5rem;
        position: relative;
        z-index: 100;
      }

      .nav__logo {
        flex-shrink: 0;
        margin-right: 1.5rem;
        transition: opacity 150ms ease;
      }
      .nav__logo:hover { opacity: 0.82; }

      .nav__links {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        flex: 1;
      }

      .nav__item { position: relative; }

      .nav__dropdown-btn {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        color: rgba(255, 255, 255, 0.9);
        font-family: var(--font-ui);
        font-weight: 500;
        font-size: 0.875rem;
        padding: 0.55rem 0.85rem;
        border-radius: 4px;
        transition: color 150ms ease, background 150ms ease;
      }
      .nav__dropdown-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.12);
      }

      .nav__chevron { transition: transform var(--transition); flex-shrink: 0; }
      .nav__item--dropdown.is-open .nav__chevron { transform: rotate(180deg); }

      .nav__dropdown {
        position: absolute;
        top: calc(100% + 0.85rem);
        left: 50%;
        transform: translateX(-50%) translateY(-10px);
        min-width: 11rem;
        background: #fff;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-drop);
        padding: 0.75rem 0;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
        z-index: 200;
      }

      .nav__dropdown::before {
        content: "";
        position: absolute;
        top: -0.45rem;
        left: 50%;
        transform: translateX(-50%);
        border: 0.45rem solid transparent;
        border-bottom-color: #fff;
        border-top: 0;
      }

      .nav__item--dropdown.is-open .nav__dropdown {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      .nav__dropdown a {
        display: block;
        padding: 0.6rem 1.5rem;
        font-family: var(--font-ui);
        font-size: 0.875rem;
        color: var(--clr-heading);
        transition: color 150ms ease, background 150ms ease;
      }
      .nav__dropdown a:hover {
        color: var(--clr-red-light);
        background: hsl(240, 10%, 97%);
      }

      .nav__auth {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-left: auto;
      }

      /* HAMBURGER */
      .nav__hamburger {
        display: none;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        width: 2.5rem;
        height: 2.5rem;
        padding: 0.4rem;
        margin-left: auto;
        border-radius: 4px;
        transition: background 150ms ease;
      }
      .nav__hamburger:hover { background: rgba(255, 255, 255, 0.12); }

      .hamburger__bar {
        display: block;
        width: 100%;
        height: 2px;
        background: #fff;
        border-radius: 2px;
        transition: transform var(--transition), opacity var(--transition);
        transform-origin: center;
      }

      .nav__hamburger[aria-expanded="true"] .hamburger__bar:nth-child(1) { transform: translateY(7px) rotate(45deg); }
      .nav__hamburger[aria-expanded="true"] .hamburger__bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
      .nav__hamburger[aria-expanded="true"] .hamburger__bar:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

      /* MOBILE MENU */
      .mobile-menu {
        position: absolute;
        top: 5.5rem;
        left: clamp(1.25rem, 5vw, 2rem);
        right: clamp(1.25rem, 5vw, 2rem);
        background: #fff;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
        padding: 1.5rem;
        z-index: 99;
        opacity: 0;
        transform: translateY(-1rem);
        visibility: hidden;
        pointer-events: none;
        transition: opacity var(--transition), transform var(--transition), visibility var(--transition);
      }

      .mobile-menu.is-open {
        opacity: 1;
        transform: translateY(0);
        visibility: visible;
        pointer-events: auto;
      }

      .mobile-menu__links { display: flex; flex-direction: column; gap: 0.2rem; }
      .mobile-menu__item { text-align: center; }

      .mobile-menu__dropdown-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        color: var(--clr-heading);
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        width: 100%;
        transition: color 150ms ease;
      }
      .mobile-menu__dropdown-btn:hover { color: var(--clr-red-light); }

      .mobile-chevron { transition: transform var(--transition); }
      .mobile-menu__item.is-open .mobile-chevron { transform: rotate(180deg); }

      .mobile-menu__dropdown {
        background: hsl(240, 6%, 96%);
        border-radius: var(--radius-md);
        overflow: hidden;
        max-height: 0;
        transition: max-height 400ms ease, padding var(--transition);
      }

      .mobile-menu__dropdown.is-open {
        max-height: 320px;
        padding: 0.5rem 0;
        margin-bottom: 0.35rem;
      }

      .mobile-menu__dropdown a {
        display: block;
        padding: 0.6rem 1.5rem;
        color: var(--clr-body);
        font-family: var(--font-ui);
        font-size: 0.875rem;
        text-align: center;
        transition: color 150ms ease;
      }
      .mobile-menu__dropdown a:hover { color: var(--clr-heading); }

      .mobile-menu__divider {
        border: none;
        border-top: 1px solid hsl(240, 6%, 88%);
        margin: 1rem 0;
      }

      .mobile-menu__auth {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        padding-top: 0.5rem;
      }

      .mobile-menu__auth .btn--primary {
        background: var(--grad-hero);
        color: #fff;
        width: 100%;
        max-width: 13rem;
      }
      .mobile-menu__auth .btn--primary:hover { opacity: 0.88; }

      /* HERO */
      .hero {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 5rem clamp(1.25rem, 5vw, 2rem);
        position: relative;
        z-index: 1;
      }

      .hero__content {
        max-width: 48rem;
        animation: fadeUp 0.75s ease both;
      }

      .hero__title {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: clamp(2rem, 5vw, 3.5rem);
        color: #fff;
        line-height: 1.15;
        margin-bottom: 1rem;
        letter-spacing: -0.01em;
      }

      .hero__subtitle {
        font-size: 1.125rem;
        color: rgba(255, 255, 255, 0.9);
        max-width: 36rem;
        margin-inline: auto;
        margin-bottom: 3rem;
      }

      .hero__actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      /* SECTIONS */
      .section {
