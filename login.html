<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to your Blogr account." />
    <title>Login | Blogr</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;600&family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============================================================
         CSS CUSTOM PROPERTIES
         ============================================================ */
      :root {
        --clr-red-light: hsl(356, 100%, 66%);
        --clr-red-dark: hsl(355, 100%, 74%);
        --clr-red-hover: hsl(356, 100%, 58%);
        --clr-hero-start: hsl(13, 100%, 72%);
        --clr-hero-end: hsl(353, 100%, 62%);
        --clr-heading: hsl(208, 49%, 24%);
        --clr-body: hsl(207, 13%, 34%);
        --clr-input-border: hsl(207, 13%, 80%);
        --clr-input-focus: hsl(356, 100%, 66%);
        --clr-error: hsl(356, 100%, 60%);
        --clr-success: hsl(145, 63%, 49%);
        --clr-bg: hsl(210, 20%, 98%);
        --grad-hero: linear-gradient(135deg, var(--clr-hero-start), var(--clr-hero-end));
        --font-body: "Overpass", sans-serif;
        --font-ui: "Ubuntu", sans-serif;
        --radius-pill: 9999px;
        --radius-lg: 1.25rem;
        --radius-md: 0.75rem;
        --radius-sm: 0.5rem;
        --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.1);
        --shadow-input: 0 0 0 3px rgba(255, 82, 93, 0.18);
        --transition: 250ms ease;
      }

      /* ============================================================
         RESET
         ============================================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: 16px;
        scroll-behavior: smooth;
      }

      body {
        font-family: var(--font-body);
        font-weight: 300;
        color: var(--clr-body);
        background: var(--clr-bg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      button {
        cursor: pointer;
        border: none;
        background: none;
        font-family: inherit;
      }

      img,
      svg {
        display: block;
        max-width: 100%;
      }

      /* ============================================================
         PAGE LOADER
         ============================================================ */
      .page-loader {
        position: fixed;
        inset: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      .page-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loader-ring {
        width: 3rem;
        height: 3rem;
        border: 3px solid hsl(240, 6%, 90%);
        border-top-color: var(--clr-red-light);
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ============================================================
         NAVIGATION
         ============================================================ */
      .nav {
        background: var(--grad-hero);
        padding: 0 clamp(1.25rem, 5vw, 2rem);
        height: 5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
      }

      .nav::before {
        content: "";
        position: absolute;
        top: -60%;
        right: -10%;
        width: 60%;
        height: 200%;
        background: radial-gradient(
          ellipse at center,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 68%
        );
        border-radius: 50%;
        pointer-events: none;
      }

      .nav__logo {
        display: flex;
        align-items: center;
        transition: opacity 150ms ease;
        position: relative;
        z-index: 1;
      }

      .nav__logo:hover {
        opacity: 0.82;
      }

      .nav__back {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: rgba(255, 255, 255, 0.9);
        font-family: var(--font-ui);
        font-weight: 500;
        font-size: 0.875rem;
        transition: color var(--transition), transform var(--transition);
        position: relative;
        z-index: 1;
      }

      .nav__back:hover {
        color: #fff;
        transform: translateX(-3px);
      }

      .nav__back svg {
        display: inline;
      }

      /* ============================================================
         MAIN CONTENT
         ============================================================ */
      .auth-page {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem clamp(1.25rem, 5vw, 2rem);
        position: relative;
      }

      /* Decorative background blobs */
      .auth-page::before,
      .auth-page::after {
        content: "";
        position: fixed;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
      }

      .auth-page::before {
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(255, 82, 93, 0.06) 0%,
          transparent 70%
        );
        top: -100px;
        right: -100px;
      }

      .auth-page::after {
        width: 300px;
        height: 300px;
        background: radial-gradient(
          circle,
          rgba(13, 100, 72, 0.04) 0%,
          transparent 70%
        );
        bottom: -50px;
        left: -50px;
      }

      /* ============================================================
         AUTH CARD
         ============================================================ */
      .auth-card {
        background: #fff;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        padding: clamp(2rem, 5vw, 3rem);
        width: 100%;
        max-width: 480px;
        position: relative;
        z-index: 1;
        animation: slideUp 0.6s ease both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(2rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Card top accent bar */
      .auth-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--grad-hero);
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }

      /* ============================================================
         CARD HEADER
         ============================================================ */
      .auth-card__header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .auth-card__icon {
        width: 64px;
        height: 64px;
        background: linear-gradient(
          135deg,
          rgba(255, 82, 93, 0.12),
          rgba(255, 122, 133, 0.08)
        );
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.25rem;
      }

      .auth-card__title {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 1.75rem;
        color: var(--clr-heading);
        margin-bottom: 0.5rem;
        line-height: 1.2;
      }

      .auth-card__subtitle {
        font-size: 0.9375rem;
        color: var(--clr-body);
        line-height: 1.6;
      }

      /* ============================================================
         SOCIAL LOGIN BUTTONS
         ============================================================ */
      .social-btns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .social-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        border: 1.5px solid var(--clr-input-border);
        border-radius: var(--radius-md);
        font-family: var(--font-ui);
        font-weight: 500;
        font-size: 0.875rem;
        color: var(--clr-heading);
        background: #fff;
        cursor: pointer;
        transition: border-color var(--transition), background var(--transition),
          box-shadow var(--transition), transform 150ms ease;
      }

      .social-btn:hover {
        border-color: var(--clr-red-light);
        background: rgba(255, 82, 93, 0.03);
        box-shadow: 0 2px 12px rgba(255, 82, 93, 0.1);
        transform: translateY(-1px);
      }

      .social-btn svg {
        flex-shrink: 0;
      }

      /* ============================================================
         DIVIDER
         ============================================================ */
      .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .divider__line {
        flex: 1;
        height: 1px;
        background: hsl(207, 13%, 90%);
      }

      .divider__text {
        font-family: var(--font-ui);
        font-size: 0.8125rem;
        color: hsl(207, 13%, 60%);
        white-space: nowrap;
      }

      /* ============================================================
         FORM
         ============================================================ */
      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-label {
        font-family: var(--font-ui);
        font-weight: 500;
        font-size: 0.875rem;
        color: var(--clr-heading);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .form-label__link {
        font-weight: 400;
        color: var(--clr-red-light);
        font-size: 0.8125rem;
        transition: color var(--transition);
      }

      .form-label__link:hover {
        color: var(--clr-red-hover);
        text-decoration: underline;
      }

      /* Input wrapper (for icon + input) */
      .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .input-icon {
        position: absolute;
        left: 1rem;
        color: hsl(207, 13%, 65%);
        pointer-events: none;
        transition: color var(--transition);
        flex-shrink: 0;
      }

      .input-wrapper:focus-within .input-icon {
        color: var(--clr-red-light);
      }

      .form-input {
        width: 100%;
        padding: 0.875rem 1rem 0.875rem 2.75rem;
        border: 1.5px solid var(--clr-input-border);
        border-radius: var(--radius-md);
        font-family: var(--font-ui);
        font-size: 0.9375rem;
        color: var(--clr-heading);
        background: #fff;
        transition: border-color var(--transition), box-shadow var(--transition);
        outline: none;
      }

      .form-input::placeholder {
        color: hsl(207, 13%, 70%);
        font-weight: 400;
      }

      .form-input:focus {
        border-color: var(--clr-input-focus);
        box-shadow: var(--shadow-input);
      }

      .form-input.is-error {
        border-color: var(--clr-error);
        box-shadow: 0 0 0 3px rgba(255, 82, 93, 0.15);
      }

      .form-input.is-success {
        border-color: var(--clr-success);
        box-shadow: 0 0 0 3px rgba(72, 199, 142, 0.15);
      }

      /* Toggle password visibility */
      .input-toggle {
        position: absolute;
        right: 1rem;
        background: none;
        border: none;
        cursor: pointer;
        color: hsl(207, 13%, 65%);
        display: flex;
        align-items: center;
        padding: 0.25rem;
        border-radius: 4px;
        transition: color var(--transition);
      }

      .input-toggle:hover {
        color: var(--clr-red-light);
      }

      /* Error message */
      .form-error {
        font-family: var(--font-ui);
        font-size: 0.8125rem;
        color: var(--clr-error);
        display: flex;
        align-items: center;
        gap: 0.35rem;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity var(--transition), transform var(--transition);
        min-height: 1.2rem;
      }

      .form-error.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* ============================================================
         REMEMBER ME ROW
         ============================================================ */
      .form-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        cursor: pointer;
        font-family: var(--font-ui);
        font-size: 0.875rem;
        color: var(--clr-body);
        user-select: none;
      }

      .checkbox-input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .checkbox-custom {
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--clr-input-border);
        border-radius: 4px;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color var(--transition), background var(--transition);
        flex-shrink: 0;
      }

      .checkbox-input:checked + .checkbox-custom {
        background: var(--clr-red-light);
        border-color: var(--clr-red-light);
      }

      .checkbox-input:checked + .checkbox-custom::after {
        content: "";
        display: block;
        width: 5px;
        height: 9px;
        border: 2px solid #fff;
        border-top: none;
        border-left: none;
        transform: rotate(45deg) translate(-1px, -1px);
      }

      .checkbox-input:focus-visible + .checkbox-custom {
        outline: 3px solid rgba(255, 82, 93, 0.3);
        outline-offset: 2px;
      }

      /* ============================================================
         SUBMIT BUTTON
         ============================================================ */
      .btn-submit {
        width: 100%;
        padding: 0.9rem 2rem;
        background: var(--grad-hero);
        color: #fff;
        border: none;
        border-radius: var(--radius-pill);
        font-family: var(--font-ui);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity var(--transition), transform 150ms ease,
          box-shadow var(--transition);
        position: relative;
        overflow: hidden;
        margin-top: 0.5rem;
      }

      .btn-submit::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0);
        transition: background var(--transition);
      }

      .btn-submit:hover::before {
        background: rgba(255, 255, 255, 0.12);
      }

      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(255, 82, 93, 0.35);
      }

      .btn-submit:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .btn-submit:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
      }

      /* Loading spinner inside button */
      .btn-submit__spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-inline: auto;
      }

      .btn-submit.is-loading .btn-submit__text {
        display: none;
      }

      .btn-submit.is-loading .btn-submit__spinner {
        display: block;
      }

      /* ============================================================
         CARD FOOTER
         ============================================================ */
      .auth-card__footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid hsl(207, 13%, 92%);
        font-family: var(--font-ui);
        font-size: 0.9rem;
        color: var(--clr-body);
      }

      .auth-card__footer a {
        color: var(--clr-red-light);
        font-weight: 600;
        transition: color var(--transition);
      }

      .auth-card__footer a:hover {
        color: var(--clr-red-hover);
        text-decoration: underline;
      }

      /* ============================================================
         FOOTER
         ============================================================ */
      .site-footer {
        background: hsl(240, 10%, 16%);
        padding: 1.5rem clamp(1.25rem, 5vw, 2rem);
        text-align: center;
        flex-shrink: 0;
      }

      .site-footer p {
        font-family: var(--font-ui);
        font-size: 0.8125rem;
        color: hsl(240, 2%, 60%);
      }

      .site-footer a {
        color: hsl(356, 100%, 74%);
        transition: color var(--transition);
      }

      .site-footer a:hover {
        color: #fff;
      }

      /* ============================================================
         SUCCESS TOAST
         ============================================================ */
      .toast {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        background: #fff;
        border-radius: var(--radius-md);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.14);
        padding: 1rem 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        max-width: 320px;
        z-index: 1000;
        transform: translateX(calc(100% + 2rem));
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        border-left: 4px solid var(--clr-success);
      }

      .toast.is-visible {
        transform: translateX(0);
      }

      .toast__icon {
        width: 36px;
        height: 36px;
        background: rgba(72, 199, 142, 0.12);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: var(--clr-success);
      }

      .toast__content {
        flex: 1;
      }

      .toast__title {
        font-family: var(--font-ui);
        font-weight: 600;
        font-size: 0.9rem;
        color: var(--clr-heading);
        margin-bottom: 0.2rem;
      }

      .toast__msg {
        font-family: var(--font-ui);
        font-size: 0.8125rem;
        color: var(--clr-body);
      }

      /* ============================================================
         STRENGTH INDICATOR (not shown on login but ready)
         ============================================================ */
      .strength-bar {
        display: flex;
        gap: 4px;
        margin-top: 0.4rem;
      }

      .strength-bar__segment {
        height: 4px;
        flex: 1;
        border-radius: 2px;
        background: hsl(207, 13%, 88%);
        transition: background var(--transition);
      }

      /* ============================================================
         RESPONSIVE
         ============================================================ */
      @media (max-width: 520px) {
        .auth-card {
          padding: 1.75rem 1.25rem;
          border-radius: var(--radius-md);
        }

        .auth-card__title {
          font-size: 1.5rem;
        }

        .social-btns {
          grid-template-columns: 1fr;
        }

        .toast {
          top: auto;
          bottom: 1.5rem;
          right: 1rem;
          left: 1rem;
          max-width: 100%;
          transform: translateY(calc(100% + 2rem));
        }

        .toast.is-visible {
          transform: translateY(0);
        }
      }

      /* ============================================================
         REDUCED MOTION
         ============================================================ */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

  <body>
    <!-- Page Loader -->
    <div class="page-loader" id="pageLoader">
      <div class="loader-ring"></div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast" role="alert" aria-live="polite">
      <div class="toast__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="toast__content">
        <p class="toast__title">Login Successful!</p>
        <p class="toast__msg">Welcome back. Redirecting you now…</p>
      </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="nav" aria-label="Site navigation">
      <a href="index.html" class="nav__logo" aria-label="Blogr home">
        <svg xmlns="http://www.w3.org/2000/svg" width="101" height="32" aria-hidden="true">
          <g fill="#FFF" fill-rule="evenodd">
            <path d="M6.856 32c-3.789 0-6.27-2.086-6.27-6.264V6.242C.586 2.086 3.067 0 6.856 0c3.789 0 6.27 2.086 6.27 6.242V10H8.49V5.825C8.49 4.453 7.88 3.81 6.856 3.81c-1.025 0-1.635.643-1.635 2.015v20.35c0 1.372.61 2.015 1.635 2.015 1.025 0 1.635-.643 1.635-2.015V19.53h4.635v4.206C13.126 27.914 10.645 32 6.856 32zM15.96.321h4.635v31.358H15.96zM31.373 32c-3.79 0-6.27-2.086-6.27-6.264V6.242C25.103 2.086 27.583 0 31.373 0c3.789 0 6.27 2.086 6.27 6.242v19.494C37.643 29.914 35.162 32 31.373 32zm-1.636-26.175v20.35c0 1.372.611 2.015 1.636 2.015 1.024 0 1.635-.643 1.635-2.015V5.825c0-1.372-.611-2.015-1.635-2.015-1.025 0-1.636.643-1.636 2.015zM51.522 32c-3.79 0-6.27-2.086-6.27-6.264V.32h4.634v25.855c0 1.372.61 2.015 1.636 2.015 1.024 0 1.635-.643 1.635-2.015V.321h4.635v25.415C57.792 29.914 55.311 32 51.522 32zM68.73 32c-3.79 0-6.27-2.086-6.27-6.264V6.242C62.46 2.086 64.94 0 68.73 0c3.788 0 6.27 2.086 6.27 6.242V13H70.364V5.825c0-1.372-.61-2.015-1.635-2.015-1.025 0-1.636.643-1.636 2.015v20.35c0 1.372.611 2.015 1.636 2.015 1.025 0 1.635-.643 1.635-2.015V19h-1.871v-3.81H75v10.546C75 29.914 72.518 32 68.73 32zM89.382 32L86.735 19.4H84.96V32H80.324V.321h6.27c3.79 0 6.27 2.086 6.27 6.242v6.574c0 2.786-1.025 4.8-2.904 5.871L92.898 32h-3.516zm-4.422-28.19V15.59h1.636c1.025 0 1.635-.643 1.635-2.015V5.825c0-1.372-.61-2.015-1.635-2.015H84.96zM100.676 32H96.04V.321h4.635z"/>
          </g>
        </svg>
      </a>

      <a href="index.html" class="nav__back" aria-label="Back to home">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
          viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back to Home
      </a>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="auth-page">
      <div class="auth-card" role="main">
        <!-- Card Header -->
        <div class="auth-card__header">
          <div class="auth-card__icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"
              viewBox="0 0 24 24" fill="none" stroke="hsl(356,100%,66%)"
              stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <h1 class="auth-card__title">Welcome back</h1>
          <p class="auth-card__subtitle">
            Sign in to your Blogr account to continue.
          </p>
        </div>

        <!-- Social Login -->
        <div class="social-btns" aria-label="Sign in with social accounts">
          <button class="social-btn" type="button" aria-label="Continue with Google">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Google
          </button>

          <button class="social-btn" type="button" aria-label="Continue with GitHub">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#24292e">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            GitHub
          </button>
        </div>

        <!-- Divider -->
        <div class="divider" role="separator">
          <div class="divider__line"></div>
          <span class="divider__text">or sign in with email</span>
          <div class="divider__line"></div>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm" novalidate aria-label="Login form">
          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg"
                width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
                aria-required="true"
                aria-describedby="email-error"
              />
            </div>
            <span class="form-error" id="email-error" role="alert" aria-live="polite">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span class="form-error__text"></span>
            </span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">
              Password
              <a href="forgot-password.html" class="form-label__link">
                Forgot password?
              </a>
            </label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg"
                width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input
                class="form-input"
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
                aria-required="true"
                aria-describedby="password-error"
              />
              <button
                type="button"
                class="input-toggle"
                id="togglePassword"
                aria-label="Show password"
              >
                <!-- Eye icon (show) -->
                <svg id="eyeShow" xmlns="http://www.w3.org/2000/svg" width="18"
                  height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <!-- Eye-off icon (hide) -->
                <svg id="eyeHide" xmlns="http://www.w3.org/2000/svg" width="18"
                  height="18" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round" aria-hidden="true"
                  style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="form-error" id="password-error" role="alert" aria-live="polite">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span class="form-error__text"></span>
            </span>
          </div>

          <!-- Remember Me -->
          <div class="form-group">
            <label class="checkbox-label">
              <input
                class="checkbox-input"
                type="checkbox"
                id="remember"
                name="remember"
              />
              <span class="checkbox-custom" aria-hidden="true"></span>
              Remember me for 30 days
            </label>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn-submit"
            id="loginBtn"
            aria-label="Sign in to your account"
          >
            <span class="btn-submit__text">Sign In</span>
            <div class="btn-submit__spinner"></div>
          </button>
        </form>

        <!-- Card Footer -->
        <div class="auth-card__footer">
          Don't have an account?
          <a href="signup.html">Create one for free →</a>
        </div>
      </div>
    </main>

    <!-- SITE FOOTER -->
    <footer class="site-footer">
      <p>
        &copy; 2025 Blogr. All rights reserved.
        <a href="#">Privacy Policy</a> ·
        <a href="#">Terms of Service</a>
      </p>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
      "use strict";

      /* ── Page Loader ─────────────────────────────── */
      (function () {
        const loader = document.getElementById("pageLoader");
        const hide = () =>
          setTimeout(() => {
            loader.classList.add("is-hidden");
            setTimeout(() => loader.remove(), 450);
          }, 300);
        document.readyState === "complete"
          ? hide()
          : window.addEventListener("load", hide);
      })();

      /* ── Password Toggle ─────────────────────────── */
      (function () {
        const toggle = document.getElementById("togglePassword");
        const input = document.getElementById("password");
        const eyeShow = document.getElementById("eyeShow");
        const eyeHide = document.getElementById("eyeHide");

        if (!toggle || !input) return;

        toggle.addEventListener("click", () => {
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          eyeShow.style.display = isPassword ? "none" : "block";
          eyeHide.style.display = isPassword ? "block" : "none";
          toggle.setAttribute(
            "aria-label",
            isPassword ? "Hide password" : "Show password"
          );
        });
      })();

      /* ── Form Validation ─────────────────────────── */
      (function () {
        const form = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginBtn = document.getElementById("loginBtn");
        const toast = document.getElementById("toast");

        function showError(inputEl, errorId, message) {
          const errorEl = document.getElementById(errorId);
          const textEl = errorEl.querySelector(".form-error__text");
          inputEl.classList.add("is-error");
          inputEl.classList.remove("is-success");
          textEl.textContent = message;
          errorEl.classList.add("is-visible");
          inputEl.setAttribute("aria-invalid", "true");
        }

        function showSuccess(inputEl, errorId) {
          const errorEl = document.getElementById(errorId);
          inputEl.classList.remove("is-error");
          inputEl.classList.add("is-success");
          errorEl.classList.remove("is-visible");
          inputEl.setAttribute("aria-invalid", "false");
        }

        function clearState(inputEl, errorId) {
          const errorEl = document.getElementById(errorId);
          inputEl.classList.remove("is-error", "is-success");
          errorEl.classList.remove("is-visible");
          inputEl.removeAttribute("aria-invalid");
        }

        function validateEmail(value) {
          if (!value) return "Email address is required.";
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value))
            return "Please enter a valid email address.";
          return null;
        }

        function validatePassword(value) {
          if (!value) return "Password is required.";
          if (value.length < 6)
            return "Password must be at least 6 characters.";
          return null;
        }

        /* Real-time validation on blur */
        emailInput.addEventListener("blur", () => {
          const err = validateEmail(emailInput.value.trim());
          err
            ? showError(emailInput, "email-error", err)
            : showSuccess(emailInput, "email-error");
        });

        emailInput.addEventListener("input", () => {
          if (emailInput.classList.contains("is-error")) {
            const err = validateEmail(emailInput.value.trim());
            err
              ? showError(emailInput, "email-error", err)
              : showSuccess(emailInput, "email-error");
          }
        });

        passwordInput.addEventListener("blur", () => {
          const err = validatePassword(passwordInput.value);
          err
            ? showError(passwordInput, "password-error", err)
            : showSuccess(passwordInput, "password-error");
        });

        passwordInput.addEventListener("input", () => {
          if (passwordInput.classList.contains("is-error")) {
            const err = validatePassword(passwordInput.value);
            err
              ? showError(passwordInput, "password-error", err)
              : showSuccess(passwordInput, "password-error");
          }
        });

        /* Form Submit */
        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const emailErr = validateEmail(emailInput.value.trim());
          const passErr = validatePassword(passwordInput.value);

          if (emailErr) showError(emailInput, "email-error", emailErr);
          else showSuccess(emailInput, "email-error");

          if (passErr) showError(passwordInput, "password-error", passErr);
          else showSuccess(passwordInput, "password-error");

          if (emailErr || passErr) {
            // Focus first error
            if (emailErr) emailInput.focus();
            else passwordInput.focus();
            return;
          }

          /* Simulate API call */
          loginBtn.classList.add("is-loading");
          loginBtn.disabled = true;

          await new Promise((r) => setTimeout(r, 1800));

          loginBtn.classList.remove("is-loading");
          loginBtn.disabled = false;

          /* Show success toast */
          toast.classList.add("is-visible");
          setTimeout(() => toast.classList.remove("is-visible"), 3500);

          /* Redirect after toast */
          setTimeout(() => {
            window.location.href = "index.html";
          }, 3200);
        });

        /* Social button placeholder */
        document.querySelectorAll(".social-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            btn.style.opacity = "0.7";
            setTimeout(() => (btn.style.opacity = ""), 200);
          });
        });
      })();
    </script>
  </body>
